<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>髮廊 360°互動導覽｜1:50</title>
<style>
:root{--bg:#f3efe8;--card:#fff;--ink:#292621;--muted:#766f66;--accent:#8a735b;--line:#d9d0c4}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
h1{margin:0;font-size:20px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.wrap{max-width:1200px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 12px;cursor:pointer}
button.active,button:hover{background:#eee5da;border-color:var(--accent)}
.viewer{position:relative;overflow:hidden;border-radius:16px;background:#c9c0b5;border:1px solid var(--line);touch-action:none;cursor:grab}
.viewer.drag{cursor:grabbing}.stage{position:relative;width:100%;height:min(68vw,720px);min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.plan{position:absolute;width:min(1120px,125%);max-width:none;user-select:none;pointer-events:none;transform-origin:center;filter:drop-shadow(0 16px 22px rgba(0,0,0,.18));transition:transform .12s ease-out}
.hot{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--accent);box-shadow:0 2px 8px #0005;cursor:pointer;transform:translate(-50%,-50%);z-index:3}
.hot span{display:none;position:absolute;left:30px;top:-7px;white-space:nowrap;background:#fff;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px}.hot:hover span{display:block}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 14px}.info{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.card h2{font-size:16px;margin:0 0 8px}.card p{margin:5px 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.item{padding:9px;border:1px solid var(--line);border-radius:9px;background:#faf8f5;text-align:left}.item b{display:block;font-size:13px}.item small{color:var(--muted);font-size:11px}
@media(max-width:700px){.stage{height:65vw;min-height:330px}.info{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
const viewer=document.getElementById('viewer'),plan=document.getElementById('plan');
let scale=1,rot=0,drag=false,lastX=0,lastY=0,mode='plan';
function render(){
 const sx=mode==='plan'?1:1.12;
 plan.style.transform=`translate(${rot*.8}px,${Math.sin(rot/35)*8}px) rotate(${rot/35}deg) scale(${scale*sx}) skewX(${mode==='plan'?0:-3}deg)`;
}
viewer.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;viewer.classList.add('drag');viewer.setPointerCapture(e.pointerId)});
viewer.addEventListener('pointermove',e=>{if(!drag)return;rot=Math.max(-220,Math.min(220,rot+(e.clientX-lastX)));scale=Math.max(.72,Math.min(1.7,scale+(e.clientY-lastY)*-.002));lastX=e.clientX;lastY=e.clientY;render()});
viewer.addEventListener('pointerup',()=>{drag=false;viewer.classList.remove('drag')});
viewer.addEventListener('pointercancel',()=>{drag=false;viewer.classList.remove('drag')});
viewer.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.72,Math.min(1.7,scale+(e.deltaY<0?.08:-.08)));render()},{passive:false});
document.getElementById('plus').onclick=()=>{scale=Math.min(1.7,scale+.1);render()};
document.getElementById('minus').onclick=()=>{scale=Math.max(.72,scale-.1);render()};
document.getElementById('reset').onclick=()=>{scale=1;rot=0;mode='plan';document.getElementById('planBtn').classList.add('active');document.getElementById('viewBtn').classList.remove('active');render()};
document.getElementById('planBtn').onclick=()=>{mode='plan';document.getElementById('planBtn').classList.add('active');document.getElementById('viewBtn').classList.remove('active');render()};
document.getElementById('viewBtn').onclick=()=>{mode='3d';document.getElementById('viewBtn').classList.add('active');document.getElementById('planBtn').classList.remove('active');render()};
document.querySelectorAll('.hot').forEach(h=>h.addEventListener('click',()=>{document.getElementById('title').textContent=h.dataset.title;document.getElementById('desc').textContent=h.dataset.size}));
document.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{const h=[...document.querySelectorAll('.hot')].find(x=>x.dataset.title===b.dataset.key);if(h){document.getElementById('title').textContent=h.dataset.title;document.getElementById('desc').textContent=h.dataset.size}}));
render();
</script>
</body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>髮廊 360° 室內設計互動導覽</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.panel{position:fixed;left:16px;top:16px;max-width:330px;background:#0c0e12cc;backdrop-filter:blur(12px);border:1px solid #ffffff22;border-radius:16px;padding:15px}h1{font-size:18px;margin:0 0 5px}p{margin:4px 0;color:#c9cbd0;font-size:13px}.badge{display:inline-block;margin-top:7px;background:#fff;color:#111;border-radius:99px;padding:4px 8px;font-size:11px}.controls{position:fixed;right:16px;top:16px;display:flex;gap:7px}button{background:#111c;color:#fff;border:1px solid #ffffff33;border-radius:11px;padding:9px 12px}button.on{background:#fff;color:#111}.info{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0c0e12ed;border:1px solid #ffffff22;border-radius:15px;padding:12px 18px;text-align:center;min-width:260px}.info.show{display:block}.info span{display:block;color:#b9bdc5;font-size:12px;margin-top:4px}.tip{position:fixed;left:16px;bottom:15px;color:#aeb3bb;font-size:11px}@media(max-width:600px){.panel{left:9px;top:9px;padding:11px;max-width:245px}.controls{right:9px;top:9px}.controls button{padding:8px 9px}.tip{display:none}}</style></head><body><canvas id="v"></canvas><div class="panel"><h1>髮廊 360° 室內設計導覽</h1><p>8550 × 8350 mm　｜　比例 1:50</p><p>拖曳旋轉・滾輪縮放・點擊標記查看配置</p><span class="badge">INTERACTIVE 360°</span></div><div class="controls"><button id="r">↺ 重置</button><button id="zi">＋</button><button id="zo">－</button><button id="pl">平面配置</button></div><div id="info" class="info"><b id="it"></b><span id="id"></span></div><div class="tip">手機單指拖曳｜電腦滑鼠拖曳</div><script>
const c=document.getElementById('v'),x=c.getContext('2d');let W,H,D,y=0,p=.05,f=68,drag=0,lx,ly,plan=0;const hs=[[-.62,.18,'接待櫃檯','約 1800 × 650 mm｜入口接待與收銀'],[-.18,-.55,'洗髮區','雙槽洗髮座｜保留給排水檢修空間'],[.38,-.58,'造型工作區','4席｜工作檯深度約 550 mm'],[.72,.12,'展示／商品牆','約 2400 mm｜鏡面與層板'],[.12,.62,'等候區','沙發＋茶几｜動線寬度建議 ≥ 900 mm']];function rs(){W=innerWidth;H=innerHeight;D=devicePixelRatio||1;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();function rot(a,b){return[a*Math.cos(y)-b*Math.sin(y),a*Math.sin(y)+b*Math.cos(y)]}function pj(a,b,z){let q=rot(a,z),cp=Math.cos(p),sp=Math.sin(p),yy=b*cp-q[1]*sp,zz=b*sp+q[1]*cp,s=Math.min(W,H)/Math.tan(f*Math.PI/360);return[W/2+q[0]*s/(zz+3.8),H/2-yy*s/(zz+3.8),zz]}function ln(a,b,col,w=1){x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}function room(){x.fillStyle='#14171b';x.fillRect(0,0,W,H);let fl=[pj(-4,-1.45,-4),pj(4,-1.45,-4),pj(4,-1.45,4),pj(-4,-1.45,4)];x.fillStyle='#262a2f';x.beginPath();fl.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();for(let i=-4;i<=4;i+=.5){ln(pj(i,-1.44,-4),pj(i,-1.44,4),'#ffffff0b');ln(pj(-4,-1.44,i),pj(4,-1.44,i),'#ffffff0b')}[[[-4,-1.45,-4],[4,-1.45,-4],[4,2.8,-4],[-4,2.8,-4]],[[-4,-1.45,4],[4,-1.45,4],[4,2.8,4],[-4,2.8,4]]].forEach((poly,k)=>{x.fillStyle=k?'#30343a':'#343940';x.beginPath();poly.forEach((q,i)=>{let z=pj(...q);i?x.lineTo(z[0],z[1]):x.moveTo(z[0],z[1])});x.closePath();x.fill()});for(let i=0;i<4;i++){let a=-1.8+i*1.2,q=[pj(a,.05,-3.93),pj(a+.85,.05,-3.93),pj(a+.85,2,-3.93),pj(a,2,-3.93)];x.fillStyle='#b9c4cc22';x.strokeStyle='#dce8ef88';x.lineWidth=2;x.beginPath();q.forEach((z,j)=>j?x.lineTo(z[0],z[1]):x.moveTo(z[0],z[1]));x.closePath();x.fill();x.stroke()}let q=[pj(-3.55,-1.45,-1.6),pj(-1.8,-1.45,-1.6),pj(-1.8,-.75,-1.6),pj(-3.55,-.75,-1.6)];x.fillStyle='#7a604d';x.beginPath();q.forEach((z,j)=>j?x.lineTo(z[0],z[1]):x.moveTo(z[0],z[1]));x.closePath();x.fill();for(let i=0;i<2;i++){let z=pj(-1.1+i*1.05,-1.15,-2.7);x.fillStyle='#121418';x.beginPath();x.ellipse(z[0],z[1],34,22,0,0,7);x.fill()}let s=pj(.5,-.85,1.55);x.fillStyle='#b08a6d';x.beginPath();x.roundRect(s[0]-65,s[1]-22,130,44,12);x.fill()}function spots(){hs.forEach((h,i)=>{let q=pj(h[0],.15,h[1]);if(q[2]<0)return;x.fillStyle='#fff';x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.arc(q[0],q[1],11,0,7);x.fill();x.stroke();x.fillStyle='#111';x.font='bold 11px sans-serif';x.textAlign='center';x.fillText(i+1,q[0],q[1]+4)})}function floor(){x.fillStyle='#f3f0e8';x.fillRect(W*.08,H*.12,W*.84,H*.76);x.strokeStyle='#333';x.lineWidth=4;x.strokeRect(W*.08,H*.12,W*.84,H*.76);let ox=W*.08,oy=H*.12,sx=W*.84/8.55,sy=H*.76/8.35;function rr(a,b,w,h,fc,t){x.fillStyle=fc;x.fillRect(ox+a*sx,oy+b*sy,w*sx,h*sy);x.strokeStyle='#444';x.strokeRect(ox+a*sx,oy+b*sy,w*sx,h*sy);x.fillStyle='#222';x.font='13px sans-serif';x.textAlign='center';x.fillText(t,ox+(a+w/2)*sx,oy+(b+h/2)*sy)}rr(.2,.3,2.1,1.2,'#c6a27e','接待櫃檯');rr(2.7,.3,3.7,1.2,'#b9c3ca','造型區 4席');rr(6.7,.3,1.4,2,'#d6c1a8','商品牆');rr(.2,2.2,2.8,2,'#9ca7ae','洗髮區');rr(3.3,2.4,2.5,2,'#c5a88d','等候區');x.fillStyle='#333';x.font='bold 16px sans-serif';x.fillText('8550 mm',W/2,oy+H*.72);x.save();x.translate(ox+W*.055,oy+H*.5);x.rotate(-Math.PI/2);x.fillText('8350 mm',0,0);x.restore()}function draw(){plan?floor():(room(),spots());requestAnimationFrame(draw)}draw();c.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY};addEventListener('pointerup',()=>drag=0);addEventListener('pointermove',e=>{if(!drag)return;y+=(e.clientX-lx)*.006;p=Math.max(-.55,Math.min(.55,p+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY});c.onwheel=e=>{e.preventDefault();f=Math.max(38,Math.min(92,f+e.deltaY*.035))};r.onclick=()=>{y=0;p=.05;f=68};zi.onclick=()=>f=Math.max(38,f-5);zo.onclick=()=>f=Math.min(92,f+5);pl.onclick=e=>{plan=!plan;e.target.classList.toggle('on',plan)};c.onclick=e=>{let b=null,bd=28;hs.forEach(h=>{let q=pj(h[0],.15,h[1]),d=Math.hypot(q[0]-e.clientX,q[1]-e.clientY);if(d<bd){bd=d;b=h}});if(b){it.textContent=b[2];id.textContent=b[3];info.classList.add('show')}};
</script></body></html>
